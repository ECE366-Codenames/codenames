services:
  codenames_db:
    image: codenames.azurecr.io/postgres:latest
    build: database
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codenames
    ports:
      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d

  app:
    build: service
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=password
    expose:
      - "8080"
    ports:
      - "8080:8080"
    depends_on:
      - codenames_db
