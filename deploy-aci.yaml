apiVersion: 2019-12-01
location: eastus
name: fullStackContainerGroup
properties:
  containers:
    - name: codenames-db
      properties:
        image: codenames.azurecr.io/postgres:latest
        environmentVariables:
          - name: POSTGRES_USER
            value: postgres
          - name: POSTGRES_PASSWORD
            value: postgres
          - name: POSTGRES_DB
            value: codenames
        resources:
          requests:
            cpu: 1
            memoryInGb: 1.5
        ports:
          - port: 5432
    - name: app
      properties:
        image: codenames.azurecr.io/service:latest
        environmentVariables:
          - name: DB_HOST
            value: localhost
          - name: POSTGRES_DB
            value: codenames
          - name: POSTGRES_USER
            value: postgres
          - name: POSTGRES_PASSWORD
            value: postgres
        resources:
          requests:
            cpu: 1
            memoryInGb: 1.5
        ports:
          - port: 8080
    - name: frontend
      properties:
        image: codenames.azurecr.io/frontend:latest
        environmentVariables:
          - name: VITE_API_URL
            value: http://codenames.eastus.azurecontainer.io:8080
        resources:
          requests:
            cpu: 1
            memoryInGb: 1.5
        ports:
          - port: 80
  osType: Linux
  ipAddress:
    type: Public
    dnsNameLabel: codenames
    ports:
      - protocol: tcp
        port: 5432
      - protocol: tcp
        port: 8080
      - protocol: tcp
        port: 80
  imageRegistryCredentials:
